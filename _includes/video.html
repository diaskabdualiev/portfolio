{% include base_path %}

<div class="responsive-embed" style="position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden;margin:1.5em 0;border-radius:6px;background:#000;">
{% if page.video_url %}
  <iframe src="{{ page.video_url }}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
{% elsif page.video_file %}
  <video controls playsinline style="position:absolute;top:0;left:0;width:100%;height:100%;">
    <source src="{% if page.video_file contains '://' %}{{ page.video_file }}{% else %}{{ page.video_file | prepend: '/images/' | prepend: base_path }}{% endif %}" type="video/mp4">
    Your browser does not support the video tag.
  </video>
{% endif %}
</div>
